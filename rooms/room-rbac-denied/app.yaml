# Room: RBAC Denied
# Pod runs with a ServiceAccount that lacks permissions to call the K8s API
# The app tries to list pods but gets "forbidden" error
apiVersion: v1
kind: ServiceAccount
metadata:
  name: escape-sa
  labels:
    app.kubernetes.io/name: escape-sa
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: room-rbac-denied
---
apiVersion: v1
kind: Pod
metadata:
  name: escape-app
  labels:
    app: escape-app
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    k8sescaperoom.dev/room: room-rbac-denied
    k8sescaperoom.dev/difficulty: intermediate
    k8sescaperoom.dev/failure-mode: Forbidden
  annotations:
    k8sescaperoom.dev/description: "ServiceAccount lacks RBAC permissions for K8s API access"
spec:
  serviceAccountName: escape-sa
  restartPolicy: OnFailure
  containers:
    - name: app
      image: bitnami/kubectl:1.28
      command:
        - /bin/sh
        - -c
        - |
          echo "================================================"
          echo "Pod Monitor Application Starting..."
          echo "================================================"
          echo ""
          echo "This application monitors pods in the namespace."
          echo "ServiceAccount: $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
          echo ""
          echo "Attempting to list pods..."
          echo ""

          if kubectl get pods 2>&1; then
            echo ""
            echo "SUCCESS: Pod listing completed!"
            echo "Application running normally."
            # Keep running on success
            sleep 3600
          else
            echo ""
            echo "FAILED: Permission denied!"
            echo "The ServiceAccount does not have permission to list pods."
            echo "Check RBAC configuration."
            exit 1
          fi
      resources:
        requests:
          memory: "64Mi"
          cpu: "10m"
        limits:
          memory: "128Mi"
          cpu: "100m"
