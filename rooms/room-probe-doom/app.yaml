# Room: Probe Doom
# Liveness probe is misconfigured - checking the wrong port
# nginx listens on port 80 but the probes check port 8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escape-app
  labels:
    app: escape-app
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    # K8sEscapeRoom labels
    k8sescaperoom.dev/room: room-probe-doom
    k8sescaperoom.dev/difficulty: intermediate
    k8sescaperoom.dev/failure-mode: CrashLoopBackOff
  annotations:
    k8sescaperoom.dev/description: "The Health Inspector. The pod starts up but Kubernetes keeps killing it"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: escape-app
  template:
    metadata:
      labels:
        app: escape-app
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          # BUG: nginx listens on port 80, but probes check port 8080!
          # Nothing is listening on 8080, so the probe always gets "connection refused"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 2
            timeoutSeconds: 1
