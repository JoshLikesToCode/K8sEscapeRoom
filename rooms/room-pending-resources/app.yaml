# Room: Pending - Resource Requests Exceed Node Capacity
# This pod cannot be scheduled because it requests more resources than available
apiVersion: v1
kind: Pod
metadata:
  name: escape-app
  labels:
    app: escape-app
    room: pending-resources
spec:
  containers:
    - name: app
      image: nginx:1.25
      ports:
        - containerPort: 80
      resources:
        # These requests are intentionally too high for a kind cluster
        # A typical kind node has ~8GB memory available
        # Requesting 64GB will never be schedulable
        requests:
          memory: "64Gi"
          cpu: "32"
        limits:
          memory: "64Gi"
          cpu: "32"
