# Room: CrashLoopBackOff - Missing Environment Variable
# This pod will crash because it requires an environment variable that is not set
apiVersion: v1
kind: Pod
metadata:
  name: escape-app
  labels:
    app: escape-app
    room: crashloop-env
spec:
  containers:
    - name: app
      # Using a simple busybox image that expects a required env var
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          # This script checks for a required environment variable
          # and crashes if it's missing - simulating a real app failure
          if [ -z "$DATABASE_URL" ]; then
            echo "FATAL: Required environment variable DATABASE_URL is not set"
            echo "Application cannot start without database configuration"
            exit 1
          fi
          echo "Connected to database: $DATABASE_URL"
          echo "Application started successfully"
          # Keep running
          while true; do sleep 3600; done
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "100m"
      # NOTE: DATABASE_URL environment variable is intentionally NOT set
      # This is the bug you need to fix!
