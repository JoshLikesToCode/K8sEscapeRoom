# Room: CrashLoopBackOff - Missing Environment Variable
# This pod will crash because it requires an environment variable that is not set
apiVersion: v1
kind: ConfigMap
metadata:
  name: escape-app-scripts
  labels:
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: room-crashloop-env
data:
  start.sh: |
    #!/bin/sh
    if [ -z "$DATABASE_URL" ]; then
      echo "FATAL: Required environment variable DATABASE_URL is not set"
      echo "Expected format: postgres://host:port/dbname"
      echo "Application cannot start without database configuration"
      exit 1
    fi
    echo "Connected to database: $DATABASE_URL"
    echo "Application started successfully"
    while true; do sleep 3600; done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escape-app
  labels:
    # Kubernetes recommended labels
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    # K8sEscapeRoom labels
    k8sescaperoom.dev/room: room-crashloop-env
    k8sescaperoom.dev/difficulty: beginner
    k8sescaperoom.dev/failure-mode: CrashLoopBackOff
  annotations:
    k8sescaperoom.dev/description: "Groundhog Deploy. The app keeps crashing on startup and nothing seems to change"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: escape-app
  template:
    metadata:
      labels:
        app: escape-app
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "/scripts/start.sh"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: escape-app-scripts
            defaultMode: 0755
