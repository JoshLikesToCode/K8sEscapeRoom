# Room: Service Selector Mismatch
# The Service selector has a typo and doesn't match the Pod labels
# Pod runs fine but Service has 0 endpoints - app is unreachable
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escape-app
  labels:
    app: escape-app
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    k8sescaperoom.dev/room: room-service-selector-mismatch
    k8sescaperoom.dev/difficulty: intermediate
    k8sescaperoom.dev/failure-mode: NoEndpoints
  annotations:
    k8sescaperoom.dev/description: "Out of Service. The app is running fine but traffic never reaches it"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: escape-app
  template:
    metadata:
      labels:
        # Correct label on the pod
        app: escape-app
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: escape-service
  labels:
    app.kubernetes.io/name: escape-service
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: room-service-selector-mismatch
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  # BUG: Selector has typo - missing hyphen!
  # Should be "escape-app" but is "escapeapp"
  selector:
    app: escapeapp
