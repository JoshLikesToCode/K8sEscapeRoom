# Room: ConfigMap Missing
# Pod references a ConfigMap that doesn't exist, causing CreateContainerConfigError
apiVersion: v1
kind: Pod
metadata:
  name: escape-app
  labels:
    # Kubernetes recommended labels
    app: escape-app
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    # K8sEscapeRoom labels
    k8sescaperoom.dev/room: room-configmap-missing
    k8sescaperoom.dev/difficulty: intermediate
    k8sescaperoom.dev/failure-mode: CreateContainerConfigError
  annotations:
    k8sescaperoom.dev/description: "Pod fails to start because it references a non-existent ConfigMap"
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "Application starting..."
          echo "Loading configuration from environment..."
          echo "APP_NAME: $APP_NAME"
          echo "APP_ENV: $APP_ENV"
          echo "LOG_LEVEL: $LOG_LEVEL"
          echo "Application configured successfully!"
          # Keep running
          while true; do sleep 3600; done
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "100m"
      # This references a ConfigMap that doesn't exist - the bug!
      envFrom:
        - configMapRef:
            name: app-config
