# Boss Room: Registry Curse
# MULTIPLE FAILURES:
#   1. ServiceAccount references wrong imagePullSecret name
#   2. Pod tries to pull from non-existent private registry
#
# The secret EXISTS but is referenced incorrectly!
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  labels:
    app.kubernetes.io/name: registry-credentials
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: boss-registry-curse
type: kubernetes.io/dockerconfigjson
data:
  # This is a dummy docker config - base64 encoded {"auths":{}}
  .dockerconfigjson: eyJhdXRocyI6e319
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  labels:
    app.kubernetes.io/name: app-sa
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: boss-registry-curse
# BUG #1: Wrong secret name!
# The secret is called "registry-credentials" but we reference "registry-creds"
imagePullSecrets:
  - name: registry-creds
---
apiVersion: v1
kind: Pod
metadata:
  name: escape-app
  labels:
    app: escape-app
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    k8sescaperoom.dev/room: boss-registry-curse
    k8sescaperoom.dev/difficulty: advanced
    k8sescaperoom.dev/failure-mode: ImagePullBackOff
  annotations:
    k8sescaperoom.dev/description: "ImagePullBackOff due to wrong imagePullSecrets reference"
spec:
  serviceAccountName: app-sa
  containers:
    - name: app
      # BUG #2: Non-existent private registry
      # This will fail to pull regardless of credentials
      image: private-registry.internal.example.com/mycompany/app:v2.1.0
      ports:
        - containerPort: 8080
      resources:
        requests:
          memory: "64Mi"
          cpu: "10m"
        limits:
          memory: "128Mi"
          cpu: "100m"
