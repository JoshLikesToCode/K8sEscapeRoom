# Room: ImagePullBackOff - Invalid Image Tag
# This pod cannot start because the image tag does not exist
apiVersion: v1
kind: Pod
metadata:
  name: escape-app
  labels:
    # Kubernetes recommended labels
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    # K8sEscapeRoom labels
    k8sescaperoom.dev/room: room-imagepullbackoff
    k8sescaperoom.dev/difficulty: beginner
    k8sescaperoom.dev/failure-mode: ImagePullBackOff
  annotations:
    k8sescaperoom.dev/description: "Pod cannot pull image due to invalid tag"
spec:
  containers:
    - name: app
      # This image tag is intentionally invalid - it does not exist
      # The typo "latset" instead of "latest" is a common real-world mistake
      image: nginx:latset
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
