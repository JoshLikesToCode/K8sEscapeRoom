# Final Boss Room: Cascading Outage
# A 3-tier application with initial bugs PLUS a rogue CronJob
# that progressively introduces new failures every 60 seconds.
#
# INITIAL BUGS (t=0):
#   1. frontend-svc selector mismatch - no endpoints
#   2. api-server missing Secret - CreateContainerConfigError
#
# META-PUZZLE: Find and stop the escalation-agent CronJob
# before fixing the cascading damage.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: web-frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    k8sescaperoom.dev/room: final-cascading-outage
    k8sescaperoom.dev/difficulty: advanced
    k8sescaperoom.dev/failure-mode: CascadingOutage
  annotations:
    k8sescaperoom.dev/description: "Cascading Outage. A production system is failing and getting worse — find what's causing the chaos before everything goes down"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    app.kubernetes.io/name: frontend-svc
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  # BUG #1: Wrong selector!
  # Deployment pods have label "app: web-frontend" but service selects "app: frontend"
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  labels:
    app: api-server
    app.kubernetes.io/name: api-server
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          # BUG #2: References Secret "api-secrets" which does not exist
          # Result: CreateContainerConfigError
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: url
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  labels:
    app.kubernetes.io/name: api-svc
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: api-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels:
    app: database
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: database-svc
  labels:
    app.kubernetes.io/name: database-svc
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: database
