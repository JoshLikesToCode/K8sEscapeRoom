# Escalation Agent - Progressive Sabotage CronJob
# This is the META-PUZZLE: players must discover and stop this CronJob
# before they can successfully fix the application.
#
# Escalation timeline:
#   Step 1 (T+1:00): Patch api-server readiness probe to port 9999
#   Step 2 (T+2:00): Create NetworkPolicy blocking ingress to api-server
#   Step 3 (T+3:00): Patch database memory limit to 4Mi (OOMKilled)
#   Step 4+ (T+4:00): No-op — all escalations complete
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: escalation-agent
  labels:
    app.kubernetes.io/name: escalation-agent
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: escalation-agent
  labels:
    app.kubernetes.io/name: escalation-agent
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "patch", "create", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: escalation-agent
  labels:
    app.kubernetes.io/name: escalation-agent
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
subjects:
  - kind: ServiceAccount
    name: escalation-agent
roleRef:
  kind: Role
  name: escalation-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: escalation-state
  labels:
    app.kubernetes.io/name: escalation-state
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
data:
  step: "0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: escalation-script
  labels:
    app.kubernetes.io/name: escalation-script
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
data:
  escalate.sh: |
    #!/bin/sh
    set -euo pipefail

    NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
    echo "[escalation-agent] Running in namespace: $NAMESPACE"

    # Read current step from ConfigMap
    STEP=$(kubectl get configmap escalation-state -n "$NAMESPACE" -o jsonpath='{.data.step}')
    echo "[escalation-agent] Current step: $STEP"

    case "$STEP" in
      0)
        echo "[escalation-agent] Step 1: Patching api-server readiness probe to port 9999"
        kubectl patch deployment api-server -n "$NAMESPACE" --type='json' \
          -p='[{"op":"add","path":"/spec/template/spec/containers/0/readinessProbe","value":{"httpGet":{"path":"/","port":9999},"initialDelaySeconds":2,"periodSeconds":3,"failureThreshold":3}}]'
        NEXT_STEP="1"
        ;;
      1)
        echo "[escalation-agent] Step 2: Creating NetworkPolicy to block ingress to api-server"
        kubectl apply -n "$NAMESPACE" -f - <<EOF
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: deny-api-ingress
    spec:
      podSelector:
        matchLabels:
          app: api-server
      policyTypes:
        - Ingress
    EOF
        NEXT_STEP="2"
        ;;
      2)
        echo "[escalation-agent] Step 3: Patching database memory limit to 4Mi (OOMKill)"
        kubectl patch deployment database -n "$NAMESPACE" --type='json' \
          -p='[{"op":"replace","path":"/spec/template/spec/containers/0/resources/limits/memory","value":"4Mi"},{"op":"replace","path":"/spec/template/spec/containers/0/resources/requests/memory","value":"4Mi"}]'
        NEXT_STEP="3"
        ;;
      *)
        echo "[escalation-agent] All escalations complete. No further actions."
        NEXT_STEP="$STEP"
        ;;
    esac

    # Update step in ConfigMap
    kubectl patch configmap escalation-state -n "$NAMESPACE" --type='merge' \
      -p="{\"data\":{\"step\":\"$NEXT_STEP\"}}"
    echo "[escalation-agent] Updated step to: $NEXT_STEP"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: escalation-agent
  labels:
    app.kubernetes.io/name: escalation-agent
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: final-cascading-outage
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: escalation-agent
          restartPolicy: Never
          containers:
            - name: escalation
              image: bitnami/kubectl:latest
              command: ["sh", "/scripts/escalate.sh"]
              volumeMounts:
                - name: escalation-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: escalation-script
              configMap:
                name: escalation-script
                defaultMode: 0755
