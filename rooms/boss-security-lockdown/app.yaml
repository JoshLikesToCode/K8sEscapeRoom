# Boss Room: Security Lockdown
# MULTIPLE FAILURES:
#   1. runAsNonRoot: true but no runAsUser set - nginx defaults to root, container won't start
#   2. readOnlyRootFilesystem: true but nginx needs to write temp/cache/pid - crashes after Bug #1 is fixed
#
# Bug #2 is invisible until Bug #1 is fixed. Layered failures.
#
# The nginx.conf already consolidates all writable paths under /tmp so
# the fix for Bug #2 is a single emptyDir volume at /tmp.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: boss-security-lockdown
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        # Write all temp files to /tmp
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;

        server {
            listen 8080;
            server_name localhost;

            location / {
                root /usr/share/nginx/html;
                index index.html index.htm;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escape-app
  labels:
    app: escape-app
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    k8sescaperoom.dev/room: boss-security-lockdown
    k8sescaperoom.dev/difficulty: advanced
    k8sescaperoom.dev/failure-mode: MultipleFailures
  annotations:
    k8sescaperoom.dev/description: "Pod blocked by security context + read-only filesystem"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: escape-app
  template:
    metadata:
      labels:
        app: escape-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          securityContext:
            # BUG #1: runAsNonRoot is true but no runAsUser is set.
            # nginx image defaults to root (UID 0), so Kubernetes will
            # refuse to start the container.
            runAsNonRoot: true
            # BUG #2: readOnlyRootFilesystem blocks nginx from writing to
            # /tmp (pid, cache, temp files). This crash is hidden until
            # Bug #1 is fixed.
            readOnlyRootFilesystem: true
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
