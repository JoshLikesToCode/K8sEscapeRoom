# Room: Secret Missing
# Pod references a Secret that doesn't exist, causing CreateContainerConfigError
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-startup-script
  labels:
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: room-secret-missing
data:
  startup.sh: |
    #!/bin/sh
    echo "Application starting..."
    echo "Connecting to database..."
    if [ -z "$DATABASE_PASSWORD" ]; then
      echo "FATAL: DATABASE_PASSWORD is not set"
      exit 1
    fi
    echo "Database connection configured with password: [REDACTED]"
    echo "Application started successfully!"
    # Keep running
    while true; do sleep 3600; done
---
apiVersion: v1
kind: Pod
metadata:
  name: escape-app
  labels:
    # Kubernetes recommended labels
    app: escape-app
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    # K8sEscapeRoom labels
    k8sescaperoom.dev/room: room-secret-missing
    k8sescaperoom.dev/difficulty: intermediate
    k8sescaperoom.dev/failure-mode: CreateContainerConfigError
  annotations:
    k8sescaperoom.dev/description: "Pod fails to start because it references a non-existent Secret"
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "/scripts/startup.sh"]
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "100m"
      env:
        - name: DATABASE_HOST
          value: "postgres.database.svc.cluster.local"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "appdb"
        - name: DATABASE_USER
          value: "appuser"
        # This references a Secret that doesn't exist - the bug!
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
      volumeMounts:
        - name: startup
          mountPath: /scripts
          readOnly: true
  volumes:
    - name: startup
      configMap:
        name: app-startup-script
        defaultMode: 0755
