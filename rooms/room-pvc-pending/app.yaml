# Escape Room: PVC Pending
# The StatefulSet references a StorageClass that doesn't exist in this cluster.
# PVCs stay Pending → pods stay Pending.
#
# Fix: create the missing StorageClass using the cluster's existing provisioner.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: escape-app
  labels:
    app: escape-app
    app.kubernetes.io/name: escape-app
    app.kubernetes.io/part-of: K8sEscapeRoom
    app.kubernetes.io/component: challenge
    k8sescaperoom.dev/room: room-pvc-pending
    k8sescaperoom.dev/difficulty: intermediate
    k8sescaperoom.dev/failure-mode: Pending
  annotations:
    k8sescaperoom.dev/description: "No Vacancy. The pod is waiting for something the cluster doesn't have"
spec:
  serviceName: escape-app-headless
  replicas: 1
  selector:
    matchLabels:
      app: escape-app
  template:
    metadata:
      labels:
        app: escape-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
  # BUG: StorageClass "fast-storage" doesn't exist in this cluster.
  # The manifests were copied from a cloud cluster that had SSD-backed storage.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "fast-storage"
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: escape-app-headless
  labels:
    app.kubernetes.io/name: escape-app-headless
    app.kubernetes.io/part-of: K8sEscapeRoom
    k8sescaperoom.dev/room: room-pvc-pending
spec:
  clusterIP: None
  selector:
    app: escape-app
  ports:
    - port: 80
      targetPort: 80
