# K8sEscapeRoom CI Pipeline
# Validates that rooms can be applied and produce expected failure states
#
# This workflow proves reproducibility by:
# 1. Creating a fresh kind cluster
# 2. Testing each room in a matrix (parallel where possible)
# 3. Collecting debug artifacts on any failure
# 4. Ensuring PRs fail if any room is flaky
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLUSTER_NAME: k8s-escape-room
  # Timeout for room tests (seconds)
  MAX_WAIT_SECONDS: 90

jobs:
  # ===========================================================================
  # Lint: Fast feedback on script quality
  # ===========================================================================
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint all scripts
        run: |
          # SC1091: Don't fail on "not following sourced file" - expected for test-helpers.sh
          echo "Linting scripts/*.sh..."
          shellcheck --exclude=SC1091 scripts/*.sh

          echo "Linting room test scripts..."
          shellcheck --exclude=SC1091 rooms/*/tests.sh

          echo "Linting room escape-test scripts..."
          shellcheck --exclude=SC1091 rooms/*/escape-tests.sh || true  # Optional file

          echo "All scripts passed linting!"

  # ===========================================================================
  # Build: Web frontend
  # ===========================================================================
  build-web:
    name: Build Web Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ===========================================================================
  # Build: Ensure API compiles
  # ===========================================================================
  build-api:
    name: Build Azure Functions API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

  # ===========================================================================
  # Build: Ensure CLI compiles
  # ===========================================================================
  build-cli:
    name: Build .NET CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/K8sEscapeRoom.Cli/K8sEscapeRoom.Cli.csproj

      - name: Build
        run: dotnet build src/K8sEscapeRoom.Cli/K8sEscapeRoom.Cli.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/K8sEscapeRoom.Cli.Tests/K8sEscapeRoom.Cli.Tests.csproj --configuration Release --verbosity normal

  # ===========================================================================
  # Setup: Create kind cluster (shared by room tests)
  # ===========================================================================
  setup-cluster:
    name: Setup Kind Cluster
    runs-on: ubuntu-latest
    outputs:
      cluster-ready: ${{ steps.verify.outputs.ready }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Run tools check
        run: ./scripts/tools-check.sh

      - name: Create kind cluster
        run: |
          kind create cluster --name $CLUSTER_NAME --config kind/cluster.yaml --wait 120s
          kubectl cluster-info --context kind-$CLUSTER_NAME

      - name: Verify cluster is ready
        id: verify
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
          kubectl get nodes -o wide
          echo "ready=true" >> $GITHUB_OUTPUT

      # Keep cluster running for matrix jobs - they'll use the same runner
      # Note: In a real matrix, each job gets its own runner, so we test sequentially here

  # ===========================================================================
  # Room Matrix: Test each room independently
  # ===========================================================================
  test-rooms:
    name: Test Room (${{ matrix.room }})
    runs-on: ubuntu-latest
    needs: [lint-scripts]  # Don't waste time if scripts are broken
    strategy:
      fail-fast: false  # Run all rooms even if one fails
      matrix:
        room:
          # Beginner rooms
          - room-groundhog-deploy
          - room-404-not-found
          - room-full
          # Intermediate rooms
          - room-uncharted-config
          - room-vault-empty
          - room-out-of-service
          - room-health-inspector
          - room-access-denied
          - room-bad-gateway
          - room-no-vacancy
          # Boss rooms (multi-failure)
          - boss-checkout-meltdown
          - boss-overzealous-warden

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Create kind cluster
        run: |
          kind create cluster --name $CLUSTER_NAME --config kind/cluster.yaml --wait 120s
          kubectl cluster-info --context kind-$CLUSTER_NAME

      - name: Verify cluster is ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
          kubectl get nodes -o wide

      - name: Install ingress controller (ingress rooms only)
        if: matrix.room == 'room-bad-gateway'
        run: |
          echo "Installing nginx ingress controller for ingress room..."
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          echo "Waiting for ingress controller to be ready..."
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s
          echo "Removing admission webhook to avoid connection refused errors in CI..."
          kubectl delete validatingwebhookconfiguration ingress-nginx-admission --ignore-not-found
          echo "Ingress controller ready!"

      - name: Apply room ${{ matrix.room }}
        id: apply
        run: |
          echo "::group::Applying room ${{ matrix.room }}"
          ./scripts/room-apply.sh ${{ matrix.room }}
          echo "::endgroup::"

      - name: Wait for failure state to manifest
        run: |
          echo "Waiting for pod to enter expected failure state..."
          # Different rooms need different wait times
          case "${{ matrix.room }}" in
            room-groundhog-deploy)
              # CrashLoopBackOff needs time for container to crash and restart
              sleep 20
              ;;
            room-404-not-found)
              # ImagePullBackOff manifests quickly
              sleep 15
              ;;
            room-full)
              # Pending is immediate, but events take a moment
              sleep 10
              ;;
            room-uncharted-config)
              # CreateContainerConfigError is immediate
              sleep 10
              ;;
            room-vault-empty)
              # CreateContainerConfigError is immediate
              sleep 10
              ;;
            room-out-of-service)
              # Need pod to be running first
              sleep 15
              ;;
            room-health-inspector)
              # Needs probe failures and restarts
              sleep 20
              ;;
            room-access-denied)
              # Pod runs and fails quickly
              sleep 15
              ;;
            room-bad-gateway)
              # Needs deployment + service ready
              sleep 20
              ;;
            boss-checkout-meltdown)
              # Pods need to start and probe needs to fail
              sleep 20
              ;;
            boss-overzealous-warden)
              # CreateContainerConfigError is immediate
              sleep 10
              ;;
            room-no-vacancy)
              # Pending is immediate, but events take a moment
              sleep 10
              ;;
            *)
              sleep 15
              ;;
          esac

          echo "Current pod status:"
          kubectl get pods -n escape-${{ matrix.room }} -o wide || true

      - name: Run room tests
        id: test
        run: |
          echo "::group::Testing room ${{ matrix.room }}"
          export MAX_WAIT_SECONDS=${{ env.MAX_WAIT_SECONDS }}
          ./scripts/room-test.sh ${{ matrix.room }}
          echo "::endgroup::"

      - name: Collect debug artifacts on failure
        if: failure()
        run: |
          NAMESPACE="escape-${{ matrix.room }}"
          ARTIFACT_DIR="debug-artifacts/${{ matrix.room }}"
          mkdir -p "$ARTIFACT_DIR"

          echo "=== Collecting debug info for ${{ matrix.room }} ==="

          # Pod list
          echo "--- Pods ---" > "$ARTIFACT_DIR/pods.txt"
          kubectl get pods -n "$NAMESPACE" -o wide >> "$ARTIFACT_DIR/pods.txt" 2>&1 || true

          # Pod YAML
          echo "--- Pod YAML ---" > "$ARTIFACT_DIR/pod-yaml.txt"
          kubectl get pods -n "$NAMESPACE" -o yaml >> "$ARTIFACT_DIR/pod-yaml.txt" 2>&1 || true

          # Pod describe
          echo "--- Pod Describe ---" > "$ARTIFACT_DIR/pod-describe.txt"
          kubectl describe pods -n "$NAMESPACE" >> "$ARTIFACT_DIR/pod-describe.txt" 2>&1 || true

          # Events
          echo "--- Events ---" > "$ARTIFACT_DIR/events.txt"
          kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' >> "$ARTIFACT_DIR/events.txt" 2>&1 || true

          # Logs (if any)
          echo "--- Logs ---" > "$ARTIFACT_DIR/logs.txt"
          for pod in $(kubectl get pods -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            echo "=== Logs for $pod ===" >> "$ARTIFACT_DIR/logs.txt"
            kubectl logs "$pod" -n "$NAMESPACE" >> "$ARTIFACT_DIR/logs.txt" 2>&1 || true
            kubectl logs "$pod" -n "$NAMESPACE" --previous >> "$ARTIFACT_DIR/logs-previous.txt" 2>&1 || true
          done

          # Node info
          echo "--- Nodes ---" > "$ARTIFACT_DIR/nodes.txt"
          kubectl get nodes -o wide >> "$ARTIFACT_DIR/nodes.txt" 2>&1 || true
          kubectl describe nodes >> "$ARTIFACT_DIR/node-describe.txt" 2>&1 || true

          echo "Debug artifacts collected in $ARTIFACT_DIR"
          ls -la "$ARTIFACT_DIR"

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.room }}
          path: debug-artifacts/${{ matrix.room }}/
          retention-days: 7

      - name: Reset room
        if: always()
        run: |
          echo "::group::Resetting room ${{ matrix.room }}"
          ./scripts/room-reset.sh ${{ matrix.room }} || true
          echo "::endgroup::"

      - name: Cleanup cluster
        if: always()
        run: |
          kind delete cluster --name $CLUSTER_NAME || true

  # ===========================================================================
  # Final Status: Aggregate results
  # ===========================================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint-scripts, build-web, build-api, build-cli, test-rooms]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Lint Scripts: ${{ needs.lint-scripts.result }}"
          echo "Build Web: ${{ needs.build-web.result }}"
          echo "Build API: ${{ needs.build-api.result }}"
          echo "Build CLI: ${{ needs.build-cli.result }}"
          echo "Test Rooms: ${{ needs.test-rooms.result }}"

          if [[ "${{ needs.lint-scripts.result }}" != "success" ]]; then
            echo "::error::Lint Scripts failed"
            exit 1
          fi

          if [[ "${{ needs.build-web.result }}" != "success" ]]; then
            echo "::error::Build Web failed"
            exit 1
          fi

          if [[ "${{ needs.build-api.result }}" != "success" ]]; then
            echo "::error::Build API failed"
            exit 1
          fi

          if [[ "${{ needs.build-cli.result }}" != "success" ]]; then
            echo "::error::Build CLI failed"
            exit 1
          fi

          if [[ "${{ needs.test-rooms.result }}" != "success" ]]; then
            echo "::error::Room tests failed"
            exit 1
          fi

          echo "::notice::All CI checks passed!"
