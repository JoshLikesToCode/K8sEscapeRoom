# Deploy to Azure Static Web Apps
# Runs on push to main only — does NOT replace CI workflow
#
# Builds web (Next.js static export) and API (Azure Functions .NET 8)
# ourselves, then deploys prebuilt artifacts to SWA.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure SWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build Web (Next.js static export) ────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web

      - name: Verify static export
        run: |
          if [ ! -f web/out/index.html ]; then
            echo "ERROR: web/out/index.html not found"
            exit 1
          fi

      # ── Build API (Azure Functions .NET 8) ───────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API dependencies
        run: dotnet restore api/K8sEscapeRoom.Api.csproj

      - name: Publish API
        run: dotnet publish api/K8sEscapeRoom.Api.csproj -c Release --no-restore -o api/publish

      - name: List API publish output
        run: ls -la api/publish

      - name: Verify API publish
        run: |
          if [ ! -f api/publish/host.json ]; then
            echo "ERROR: api/publish/host.json not found"
            echo "Contents of api/publish:"
            ls -la api/publish || echo "Directory does not exist"
            exit 1
          fi

      # ── Deploy to SWA ────────────────────────────────────────
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "web/out"
          output_location: ""
          api_location: "api/publish"
          skip_app_build: true
          skip_api_build: true
