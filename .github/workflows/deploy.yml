# Deploy to Azure Static Web Apps
# Runs on push to main only — does NOT replace CI workflow
#
# Builds the Next.js static export ourselves, then lets SWA
# upload the prebuilt output and build the Azure Functions API.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure SWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build Web (Next.js static export) ────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web

      - name: Verify static export
        run: test -f web/out/index.html || (echo "ERROR: web/out/index.html not found" && exit 1)

      # ── Deploy to SWA ────────────────────────────────────────
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "web"
          output_location: "out"
          api_location: "api"
          skip_app_build: true
